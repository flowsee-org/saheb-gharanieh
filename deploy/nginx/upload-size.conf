# How large a request body nginx will accept.
#
# This is the one limit PHP cannot see and the panel cannot work around. nginx
# checks Content-Length itself and answers 413 Request Entity Too Large from its
# own error page, before the request is ever handed to php-fpm — so Laravel never
# runs, the size hint under the image field is never consulted, and none of the
# careful error messages in App\Support\UploadLimit get a chance to appear.
#
# Its default is 1M. That is the whole story behind "photos under 1 MB upload
# fine, anything larger gives 413 nginx/1.24.0": the panel offers 6 MB and PHP is
# configured for 8M/12M in public/.user.ini, but nginx was refusing the body at
# 1 MB regardless.
#
# 12M to match post_max_size in public/.user.ini. Deliberately not lower: nginx
# refusing a body that PHP would have accepted puts the limit back somewhere the
# application cannot explain. Deliberately not much higher either — nginx buffers
# the whole body to disk before php-fpm sees it, so anything above post_max_size
# is bandwidth and disk spent on a request PHP is going to discard whole.
#
# The layered result, for a photo of a given size:
#
#   up to 6 MB    accepted, and stored
#   6 – 8 MB      refused by Laravel's max: rule, in Persian, naming the real limit
#   8 – 12 MB     refused by PHP's upload_max_filesize; Laravel reports the field
#   over 12 MB    refused here, by nginx, with the bare page this file exists to avoid
#
# ----------------------------------------------------------------------------
# Installing
#
# client_max_body_size is valid in the http, server and location contexts, so on
# Ubuntu's stock nginx this file can simply be dropped in — nginx.conf already
# carries `include /etc/nginx/conf.d/*.conf;` inside its http block:
#
#     sudo cp deploy/nginx/upload-size.conf /etc/nginx/conf.d/upload-size.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# `nginx -t` first, always: a reload on a config that does not parse leaves the
# old workers serving and the change silently unapplied, and a restart on one
# takes the site down.
#
# At http level this raises the ceiling for every server block on the host, which
# is what a single-site VPS wants. To keep it to this site instead, include it
# from within the server block for sgharanie.ir rather than from conf.d.
#
# Undoing it is deleting the file and reloading. Nothing else reads it.

client_max_body_size 12M;
