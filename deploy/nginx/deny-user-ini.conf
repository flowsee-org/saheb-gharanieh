# Keep public/.user.ini out of reach.
#
# That file sits in the web root because the FastCGI SAPIs will only read it from
# the directory of the running script. nginx has no notion of it being special:
# its stock config hides nothing but .ht*, so without a rule like this one
# https://sgharanie.ir/.user.ini is simply served as text.
#
# Nothing in it is secret — two upload limits and the reasoning for them. But it
# names the PHP setup to anyone who asks, and public/.htaccess already denies it
# for Apache, so nginx should not be the deployment where that stops being true.
#
# ----------------------------------------------------------------------------
# Installing
#
# `location` is only valid inside a server block, so this one cannot go in
# conf.d/ the way upload-size.conf does — it has to be included from the server
# block for the site:
#
#     server {
#         server_name sgharanie.ir;
#         ...
#         include /etc/nginx/snippets/deny-user-ini.conf;
#     }
#
#     sudo cp deploy/nginx/deny-user-ini.conf /etc/nginx/snippets/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Placement within the block does not matter: nginx picks the location by match,
# not by reading order — except among regex locations, where the first match in
# order wins. The site's own regex location is the `\.php$` handler for php-fpm,
# which .user.ini cannot match, so the two never compete.
#
# A broader rule denying every dotfile would cover this and anything like it, but
# has to spare .well-known/ or it breaks ACME certificate renewal:
#
#     location ~ /\.(?!well-known) { deny all; }

location ~ /\.user\.ini$ {
    deny all;

    # Not just 403: a refusal that still confirms the file is there tells the
    # asker most of what they wanted to know.
    log_not_found off;
    access_log off;
}
